
[config]
conf = true

[source]
mode = "rabbit"         # mode = "file" or "rabbit"
# "file": cdr records are stored in files on disk
# "rabbit": cdr records are sent to RabbitMQ queue

[file]
dir = "records"         # directory holding the .cdr files
rotate_seconds = 600    # seconds per .cdr file

[rabbit]
url = "amqp://guest:guest@localhost/"
queue = "cdr"

[simulator]
gen_interval = 0.001    # seconds between generated records
