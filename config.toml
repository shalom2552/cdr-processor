[config]
conf = true             # senaty check, fails on false

[log]
level = "info"          # debug, info, warn, error, none

[source]
mode = "file"           # mode = "file" or "rabbit"
format = "pipe"         # pipe is the only supported format

[source.file]
readers     = 4                     # number of readers threads, 0 for max
ready_dir   = "records/ready/"      # directory holding the .cdr files
process_dir = "records/.processing" # directory holding fils in process
done_dir    = "records/done"        # directory holding processed files
fail_dir    = "records/failed"      # directory holding failed files

[source.rabbit]
url = "amqp://guest:guest@localhost/"
queue = "cdr"           # RabbitMQ queue name for cdr messages

[generator]
rotate_seconds = 600    # seconds per .cdr file
gen_interval = 0.001    # seconds between generated records
