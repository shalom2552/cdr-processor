name: tests

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
 
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ make
 
      - name: Build project
        run: make clean all

      - name: Run tests
        run: make test

