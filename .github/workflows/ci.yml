name: tests

on:
  push:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y g++ make
 
      - name: Build project
        run: make clean all

      - name: Run tests
        run: make test

